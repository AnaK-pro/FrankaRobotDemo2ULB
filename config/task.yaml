task:
  name: shape_sorting

  max_episode_steps: 1000

  # Les 3 formes que le robot doit trier
  shapes:
    - id: 0
      name: cube
      size: [0.05, 0.05, 0.05]
      mass: 0.1
      color: [1.0, 0.0, 0.0]
      spawn_position: [0.45, -0.15, 0.12]

    - id: 1
      name: cylinder
      size: [0.04, 0.04, 0.06]
      mass: 0.1
      color: [0.0, 0.0, 1.0]
      spawn_position: [0.45, 0.0, 0.12]

    - id: 2
      name: pyramid
      size: [0.05, 0.05, 0.06]
      mass: 0.1
      color: [0.0, 0.8, 0.0]
      spawn_position: [0.45, 0.15, 0.12]

  # Les 3 bacs correspondants (a droite du robot)
  bins:
    - id: 0
      name: bin_cube
      shape: cube
      position: [0.55, -0.35, 0.05]
      size: [0.12, 0.12, 0.08]
      color: [1.0, 0.6, 0.6]

    - id: 1
      name: bin_cylinder
      shape: cylinder
      position: [0.55, 0.0, 0.05]
      size: [0.12, 0.12, 0.08]
      color: [0.6, 0.6, 1.0]

    - id: 2
      name: bin_pyramid
      shape: pyramid
      position: [0.55, 0.35, 0.05]
      size: [0.12, 0.12, 0.08]
      color: [0.6, 1.0, 0.6]

  # Table de travail
  table:
    position: [0.5, 0.0, 0.0]
    size: [0.8, 0.8, 0.05]

  # Recompenses
  reward:
    correct_bin: 10.0
    wrong_bin: -5.0
    drop_penalty: -2.0
    step_penalty: -0.01
    grasp_bonus: 1.0
    all_sorted_bonus: 30.0

  # Tolerance pour considerer qu'une forme est dans le bon bac
  placement_tolerance: 0.06

  # Randomisation
  domain_randomization:
    enabled: true
    shape_mass_range: [0.05, 0.2]
    table_friction_range: [0.3, 0.8]
